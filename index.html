<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>History Calendar</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
    
    <style>
        :root {
            --bg-base: #1a1614;
            --bg-card: #28211e;
            --accent: #d97706;
            --text-main: #f3f4f6;
            --border-color: #3d332e;
        }

        body { 
            background-color: var(--bg-base); 
            color: var(--text-main);
            font-family: 'Georgia', serif;
            margin: 0; padding: 10px;
            overflow-x: hidden;
        }
        
        #calendar { 
            background: var(--bg-card); 
            border-radius: 12px; 
            border: 1px solid var(--border-color);
            padding: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* --- TIMELINE & LAYOUT --- */
        .timeline-wrapper { display: flex; flex-direction: column; height: 75vh; }
        @media (min-width: 768px) { .timeline-wrapper { flex-direction: row; height: 550px; } }

        .pipeline-column {
            width: 100%; height: 40%; border-bottom: 1px solid var(--border-color);
            position: relative; overflow-y: auto;
        }
        @media (min-width: 768px) { .pipeline-column { width: 40%; height: 100%; border-bottom: none; border-right: 1px solid var(--border-color); } }

        .pipeline-line { position: absolute; left: 25px; top: 0; bottom: 0; width: 2px; background: var(--border-color); }

        .timeline-item { position: relative; padding: 15px 15px 15px 55px; cursor: pointer; transition: 0.2s; border-bottom: 1px solid rgba(255,255,255,0.02); }
        .timeline-node {
            position: absolute; left: 18px; top: 20px; width: 16px; height: 16px;
            background: var(--bg-card); border: 2px solid var(--accent);
            border-radius: 50%; z-index: 2; transition: all 0.3s ease;
        }

        .timeline-item.active-node .timeline-node {
            background-color: var(--accent) !important;
            box-shadow: 0 0 12px var(--accent);
            transform: scale(1.2);
        }

        .year-label { font-weight: bold; font-size: 1.2rem; color: var(--accent); }
        .timeline-item.active-node .year-label { color: #fff; }

        /* --- PREVIEW AREA --- */
        .preview-column { width: 100%; height: 60%; padding: 25px; background: rgba(0, 0, 0, 0.2); overflow-y: auto; }
        @media (min-width: 768px) { .preview-column { width: 60%; height: 100%; } }

        .event-detail-block { margin-bottom: 40px; padding-bottom: 25px; border-bottom: 1px solid var(--border-color); }
        .preview-img { width: 100%; max-height: 280px; object-fit: cover; border-radius: 10px; margin-bottom: 15px; border: 1px solid var(--border-color); }
        .preview-title { color: var(--accent); font-size: 1.5rem; margin-bottom: 10px; font-weight: bold; }
        .preview-desc { font-family: sans-serif; line-height: 1.7; color: #d1d5db; font-size: 1rem; }

        /* --- BANNER TOTAL EVENT --- */
        .total-event-banner {
            background: rgba(217, 119, 6, 0.1);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 8px 15px;
            border-radius: 30px;
            font-size: 0.85rem;
            display: inline-block;
            margin-bottom: 15px;
            font-family: sans-serif;
            font-weight: 600;
        }

        /* --- UI ELEMENTS --- */
        .btn-wiki { display: inline-block; color: var(--accent); border: 1px solid var(--accent); padding: 5px 12px; border-radius: 5px; font-size: 0.8rem; text-decoration: none; margin-right: 5px; margin-bottom: 5px; transition: 0.2s; }
        .btn-wiki:hover { background: var(--accent); color: #fff; }

        .fc .fc-daygrid-day-number { color: var(--text-main); text-decoration: none; width: 100%; text-align: center; padding: 12px !important; display: block; }
        .fc-daygrid-day:hover { background: rgba(217, 119, 6, 0.1); cursor: pointer; }
        .fc-daygrid-day-events { display: none; }
        
        .modal-content { background-color: var(--bg-card); border: 1px solid var(--accent); border-radius: 20px; }
    </style>
</head>
<body>

    <div class="container-fluid">
        <header class="text-center mb-4 pt-3">
            <h1 class="fw-light m-0" style="color: var(--accent); letter-spacing: 5px; font-size: 1.8rem;">HISTORY CALENDAR</h1>
            <p class="text-muted small">Select a date to explore world archives</p>
        </header>
        <div class="row justify-content-center">
            <div class="col-12 col-xl-9"><div id="calendar"></div></div>
        </div>
    </div>

    <div class="modal fade" id="eventModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-xl">
            <div class="modal-content shadow-lg">
                <div class="modal-header border-0 pb-0">
                    <div class="w-100 text-center">
                        <h2 class="modal-title h4 text-white mb-2" id="modalTitle"></h2>
                        <div id="totalEventWrapper"></div>
                        <button type="button" class="btn-close btn-close-white shadow-none position-absolute end-0 top-0 m-3" data-bs-dismiss="modal"></button>
                    </div>
                </div>
                <div class="modal-body p-0">
                    <div class="timeline-wrapper">
                        <div class="pipeline-column" id="pipelineList"><div class="pipeline-line"></div></div>
                        <div class="preview-column">
                            <div id="previewPlaceholder" class="text-center text-muted my-auto small italic"><p>Click on a year to see details</p></div>
                            <div id="eventPreview" style="display:none;"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

    <script>
        $(document).ready(function() {
            const calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
                initialView: 'dayGridMonth',
                locale: 'en', // Switched to English
                height: 'auto',
                headerToolbar: { left: 'prev,next', center: 'title', right: 'today' },
                dateClick: function(info) { loadData(info.date); }
            });
            calendar.render();

            function loadData(date) {
                const m = date.getMonth() + 1;
                const d = date.getDate();
                const fileName = `Wiki-${m}-${d}.json`;

                // Set English date format in title
                $('#modalTitle').text(`${date.toLocaleString('en-US', { month: 'long', day: 'numeric' })}`);
                $('#totalEventWrapper').empty();
                $('#pipelineList .timeline-item').remove();
                $('#eventPreview').hide().empty();
                $('#previewPlaceholder').show();
                $('#eventModal').modal('show');

                $.ajax({
                    url: `wiki/${fileName}`,
                    dataType: 'json',
                    success: function(data) {
                        const rawEvents = data.events || [];
                        
                        // Total Event Banner
                        if(rawEvents.length > 0) {
                            $('#totalEventWrapper').html(`<span class="total-event-banner">Total ${rawEvents.length} Historical Events</span>`);
                        }

                        // Grouping by year
                        const groupedEvents = {};
                        rawEvents.forEach(ev => {
                            if (!groupedEvents[ev.year]) groupedEvents[ev.year] = [];
                            groupedEvents[ev.year].push(ev);
                        });

                        const sortedYears = Object.keys(groupedEvents).sort((a, b) => a - b);

                        sortedYears.forEach((year) => {
                            const eventsInYear = groupedEvents[year];
                            const countBadge = eventsInYear.length > 1 ? `<br><small style="font-family:sans-serif; font-size:0.7rem; opacity:0.7;">${eventsInYear.length} Events</small>` : '';

                            const item = $(`
                                <div class="timeline-item">
                                    <div class="timeline-node"></div>
                                    <div class="year-label">Year ${year}${countBadge}</div>
                                </div>
                            `);

                            item.on('click', function() {
                                $('.timeline-item').removeClass('active-node');
                                item.addClass('active-node');
                                $('#previewPlaceholder').hide();
                                
                                let rightHtml = `<h3 class="preview-title" style="border-bottom:1px solid var(--border-color); padding-bottom:15px; margin-bottom:30px;">Archive of Year ${year}</h3>`;
                                
                                eventsInYear.forEach((ev, idx) => {
                                    let imgUrl = '';
                                    if (ev.pages) {
                                        const p = ev.pages.find(x => x.thumbnail);
                                        if (p) imgUrl = p.thumbnail.source;
                                    }

                                    rightHtml += `
                                        <div class="event-detail-block">
                                            ${eventsInYear.length > 1 ? `<div class="badge mb-3" style="background:var(--accent); color:#000;">Event #${idx + 1}</div>` : ''}
                                            ${imgUrl ? `<img src="${imgUrl}" class="preview-img shadow">` : ''}
                                            <p class="preview-desc">${ev.text}</p>
                                            <div class="d-flex flex-wrap gap-2">
                                                ${ev.pages.map(p => `<a href="${p.content_urls.desktop.page}" target="_blank" class="btn-wiki">📖 ${p.title}</a>`).join('')}
                                            </div>
                                        </div>
                                    `;
                                });

                                $('#eventPreview').html(rightHtml).fadeIn(300);
                            });

                            $('#pipelineList').append(item);
                        });

                        if(sortedYears.length > 0) $('.timeline-item').first().trigger('click');
                    },
                    error: function() {
                        $('#previewPlaceholder').html('<div class="text-danger py-5">Archive data not found for this date.</div>');
                    }
                });
            }
        });
    </script>
</body>
</html>
